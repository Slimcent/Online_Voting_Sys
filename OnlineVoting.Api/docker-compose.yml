services:
  online-voting-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: online-voting-sql
    env_file:
      - .env.docker
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - online-voting-sql-data:/var/opt/mssql
    networks:
      - online-voting-network

  online-voting-redis:
    image: redis:7.4-alpine
    container_name: online-voting-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - online-voting-network

  online-voting-tempo:
    image: grafana/tempo:3.0.2
    container_name: online-voting-tempo
    command:
      - -config.file=/etc/tempo/config.yaml
    volumes:
      - ./Observability/tempo.yaml:/etc/tempo/config.yaml:ro
      - online-voting-tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - online-voting-network

  online-voting-prometheus:
    image: prom/prometheus:v3.13.2
    container_name: online-voting-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./Observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - online-voting-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - online-voting-network

  online-voting-grafana:
    image: grafana/grafana:13.2.0
    container_name: online-voting-grafana
    volumes:
      - ./Observability/Grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./Observability/Grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./Observability/Grafana/dashboards:/var/lib/grafana/dashboards:ro
      - online-voting-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - online-voting-network

  online-voting-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    container_name: online-voting-otel-collector
    command:
      - --config=/etc/otelcol/config.yaml
    volumes:
      - ./Observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4318:4318"
      - "13133:13133"
    networks:
      - online-voting-network

  migration-generator:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: online-voting-migration-generator
    working_dir: /src
    volumes:
      - ..:/src
      - online-voting-api-publish:/publish
    env_file:
      - .env.docker
    depends_on:
      online-voting-sql:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        dotnet tool install --global dotnet-ef --version "10.*" &&
        export PATH="$$PATH:/root/.dotnet/tools" &&

        dotnet restore /src/Online_Voting_Sys.sln &&

        if [ ! -d /src/OnlineVoting.Api/Migrations ] || [ -z "$$(find /src/OnlineVoting.Api/Migrations -name '*_*.cs' -type f 2>/dev/null)" ]; then
          echo "No migrations found. Creating InitialCreate migration." &&
          dotnet-ef migrations add InitialCreate \
            --project /src/OnlineVoting.Api/OnlineVoting.Api.csproj \
            --startup-project /src/OnlineVoting.Api/OnlineVoting.Api.csproj &&

          echo "Rebuilding Debug output with the generated migration." &&
          dotnet build /src/OnlineVoting.Api/OnlineVoting.Api.csproj -c Debug --no-restore
        else
          echo "Migration already exists. Skipping InitialCreate generation."
        fi &&

        dotnet publish /src/OnlineVoting.Api/OnlineVoting.Api.csproj -c Release -o /publish --no-restore
    networks:
      - online-voting-network

  online-voting-api:
    build:
      context: ..
      dockerfile: OnlineVoting.Api/Dockerfile
    image: online-voting-api:local
    container_name: online-voting-api
    working_dir: /app
    volumes:
      - online-voting-api-publish:/app
    env_file:
      - .env.docker
    ports:
      - "8180:8080"
    depends_on:
      migration-generator:
        condition: service_completed_successfully
      online-voting-sql:
        condition: service_healthy
      online-voting-redis:
        condition: service_healthy
    networks:
      - online-voting-network

networks:
  online-voting-network:
    driver: bridge

volumes:
  online-voting-sql-data:
  online-voting-api-publish:
  online-voting-tempo-data:
  online-voting-prometheus-data:
  online-voting-grafana-data:  